# ─────────────────────────────────────────────────────────────────────────────
# Periplus Cart SDET Framework — Test Configuration
#
# IMPORTANT: This file is committed to VCS with PLACEHOLDER values only.
# Before running tests, copy this file to config.properties and fill in
# the real values. NEVER commit real credentials to source control.
#
# Location: src/test/resources/config.properties
# ─────────────────────────────────────────────────────────────────────────────

# ── Application Under Test ────────────────────────────────────────────────────
app.base.url=https://www.periplus.com

# ── Test Account Credentials ──────────────────────────────────────────────────
# Register a dedicated test account at https://www.periplus.com before running.
user.email=your_registered_email@example.com
user.password=your_password

# ── Browser Configuration ─────────────────────────────────────────────────────
# Supported values: chrome | firefox | edge
browser=chrome
# Set to true for CI/CD pipelines (no visible browser window)
browser.headless=false

# ── Wait Timeouts ─────────────────────────────────────────────────────────────
# Explicit wait timeout (seconds) — used by WebDriverWait in page objects
wait.explicit.seconds=15
# Page load timeout (seconds)
wait.page.load.seconds=30

# ── Test Data ─────────────────────────────────────────────────────────────────
# The keyword used to search for a product in TC-ATC-001 through TC-ATC-004
# Choose a keyword guaranteed to return in-stock results (e.g., a popular title)
test.search.keyword=Atomic Habits
